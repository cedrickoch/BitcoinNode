services:
    bitcoin:
        image: 4324363/bitcoind:32.1
        container_name: bitcoind
        stop_grace_period: 5m # let bitcoind flush its UTXO cache
        volumes:
            - bitcoin_data:/home/bitcoin/.bitcoin
        networks:
          core:
            # fixed address so bitcoind can bind RPC to this interface only
            ipv4_address: 172.28.0.2
        cap_drop: [ALL]
        # our image's entrypoint starts as root, chowns the data dir, then drops
        # to the bitcoin user; those caps come back even with the rest dropped
        cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
        security_opt: ["no-new-privileges:true"]
        logging: # bounded so an unattended run cannot fill the SD card
          driver: json-file
          options:
            max-size: 10m
            max-file: "3"
        healthcheck: # functional probe, see contracts/health-probes.md
          test: ["CMD-SHELL", "bitcoin-cli getblockchaininfo | grep -q 'initialblockdownload\": false'"]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 300s
        pids_limit: 300
        # no mem_limit: initial block sync and snapshot import have RAM spikes
        command: ["-printtoconsole", "-testnet4", "-rpcbind=127.0.0.1", "-rpcbind=172.28.0.2","-rpcport=48332", "-rpcallowip=127.0.0.1", "-rpcallowip=172.28.0.0/24", "-txindex=1"]

    electrs:
      image: 4324363/electrs:v0.12.0-arm64
      container_name: electrs
      user: "1000:1000" # not root; reads the cookie file owned by uid 1000
      cap_drop: [ALL]
      read_only: true
      tmpfs:
        - /tmp
      security_opt: ["no-new-privileges:true"]
      logging: # bounded so an unattended run cannot fill the SD card
        driver: json-file
        options:
          max-size: 10m
          max-file: "3"
      healthcheck: # functional probe, see contracts/health-probes.md
        test: ["CMD-SHELL", "wget -qO- localhost:4224/ >/dev/null"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 300s
      pids_limit: 300
      # no mem_limit: initial indexing has big RAM spikes
      command: ["/usr/bin/electrs", "--network=testnet4"] # Already set in testnet mode
      networks:
        - default
        - core
      ports:
        - "40001:40001" # For the electrs RPC API on testnet4
        - "44224:44224" # Promeetheus metrics
      volumes:
        - electrs_data:/home/bitcoin
        - bitcoin_data:/home/bitcoin/.bitcoin:ro
      environment:
          - ELECTRS_DAEMON_DIR=/home/bitcoin/.bitcoin/ # Specify the directory since running in testnet mode we will have a different dir structure
          - ELECTRS_DAEMON_RPC_ADDR=bitcoin:48332 # Need to match the port as well
          - ELECTRS_DAEMON_P2P_ADDR=bitcoin:48333 # Need to match the port as well
          - ELECTRS_DAEMON_RPC_COOKIE=/home/bitcoin/.bitcoin/testnet4/.cookie # Need to match the cookie file
          - ELECTRS_DB_DIR=/home/bitcoin/db
          - ELECTRS_ELECTRUM_RPC_ADDR=electrs:40001
          - ELECTRS_MONITORING_ADDR=electrs:44224
      depends_on:
        bitcoin:
          condition: service_healthy

    web:
      environment:
        FRONTEND_HTTP_PORT: "8080"
        BACKEND_MAINNET_HTTP_HOST: "api"
      image: mempool/frontend:v3.3.1
      container_name: mempool-frontend
      user: "1000:1000"
      cap_drop: [ALL]
      read_only: true
      tmpfs:
        - /var/cache/nginx
        - /var/run
      security_opt: ["no-new-privileges:true"]
      logging: # bounded so an unattended run cannot fill the SD card
        driver: json-file
        options:
          max-size: 10m
          max-file: "3"
      healthcheck: # functional probe, see contracts/health-probes.md
        test: ["CMD-SHELL", "wget -qO- localhost:8080/ >/dev/null"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 120s
      pids_limit: 100
      restart: on-failure
      stop_grace_period: 1m
      command: "./wait-for db:3306 --timeout=720 -- nginx -g 'daemon off;'"
      depends_on:
        db:
          condition: service_healthy
      networks:
        - explorer
      ports:
        - "80:8080"

    api:
      environment:
        MEMPOOL_BACKEND: "electrum"
        ELECTRUM_HOST: electrs
        ELECTRUM_PORT: "40001"
        ELECTRUM_TLS: "false"
        CORE_RPC_HOST: bitcoin
        CORE_RPC_PORT: "48332"
        CORE_RPC_COOKIE: true
        CORE_RPC_COOKIE_PATH: "/home/bitcoin/.bitcoin/testnet4/.cookie"
        DATABASE_ENABLED: "true"
        DATABASE_HOST: "db"
        DATABASE_DATABASE: "mempool"
        DATABASE_USERNAME: "mempool"
        DATABASE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env (scripts/generate-secrets.sh)}
        STATISTICS_ENABLED: "true"
      image: mempool/backend:v3.3.1
      container_name: mempool-backend
      user: "1000:1000" # not root; reads the cookie file owned by uid 1000
      networks:
        - core
        - explorer
      cap_drop: [ALL]
      read_only: true
      tmpfs:
        - /tmp
      security_opt: ["no-new-privileges:true"]
      logging: # bounded so an unattended run cannot fill the SD card
        driver: json-file
        options:
          max-size: 10m
          max-file: "3"
      healthcheck: # functional probe, see contracts/health-probes.md
        test: ["CMD-SHELL", "wget -qO- localhost:8999/api/v1/blocks >/dev/null"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 300s
      pids_limit: 300
      restart: on-failure
      stop_grace_period: 1m
      command: "./wait-for-it.sh db:3306 --timeout=720 --strict -- ./start.sh"
      depends_on:
        db:
          condition: service_healthy
      volumes:
        - mempool_data:/backend/cache
        - bitcoin_data:/home/bitcoin/.bitcoin:ro


    db:
      environment:
        MYSQL_DATABASE: "mempool"
        MYSQL_USER: "mempool"
        # from .env; fail closed rather than fall back to a known string
        MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env (scripts/generate-secrets.sh)}
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env (scripts/generate-secrets.sh)}
      # pinned exact version; trust basis and refresh trigger in docs/trust.md
      image: mariadb:11.4
      container_name: mempool-db
      user: "root" # entrypoint needs root: it chowns the data dir and drops to the mysql user
      cap_drop: [ALL]
      cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
      security_opt: ["no-new-privileges:true"]
      logging: # bounded so an unattended run cannot fill the SD card
        driver: json-file
        options:
          max-size: 10m
          max-file: "3"
      healthcheck: # functional probe, see contracts/health-probes.md
        test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 120s
      pids_limit: 300
      restart: on-failure
      stop_grace_period: 1m
      networks:
        - explorer # explorer plane only: nothing here may reach the node's RPC
      volumes:
        - mempool_db:/var/lib/mysql

    grafana:
      image: grafana/grafana:11.3.1
      cap_drop: [ALL]
      security_opt: ["no-new-privileges:true"]
      logging: # bounded so an unattended run cannot fill the SD card
        driver: json-file
        options:
          max-size: 10m
          max-file: "3"
      read_only: true
      tmpfs: [/tmp]
      healthcheck: # functional probe, see contracts/health-probes.md
        test: ["CMD-SHELL", "wget -qO- localhost:3000/api/health >/dev/null"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 120s
      pids_limit: 200
      restart: always
      ports:
        - 3000:3000
      volumes:
        - grafana_data:/var/lib/grafana

    prometheus:
      image: prom/prometheus:v3.1.0
      # non-root `nobody`; the image runs as UID 65534 for prometheus and json_exporter
      user: "65534:65534"
      cap_drop: [ALL]
      read_only: true
      tmpfs:
        - /tmp
      security_opt: ["no-new-privileges:true"]
      logging: # bounded so an unattended run cannot fill the SD card
        driver: json-file
        options:
          max-size: 10m
          max-file: "3"
      healthcheck: # functional probe, see contracts/health-probes.md
        test: ["CMD-SHELL", "wget -qO- localhost:9090/-/ready >/dev/null"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 120s
      pids_limit: 200
      restart: always
      ports:
        - 9090:9090
      volumes:
        - prometheus_data:/prometheus
        - ./prometheus/:/etc/prometheus/
      command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      depends_on:
        node_exporter:
          condition: service_healthy

    node_exporter:
      image: prom/node-exporter:v1.8.2
      cap_drop: [ALL]
      read_only: true
      security_opt: ["no-new-privileges:true"]
      logging: # bounded so an unattended run cannot fill the SD card
        driver: json-file
        options:
          max-size: 10m
          max-file: "3"
      healthcheck: # functional probe, see contracts/health-probes.md
        test: ["CMD-SHELL", "wget -qO- localhost:9100/metrics >/dev/null"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 120s
      pids_limit: 100
      restart: always
      volumes:
        - /proc:/host/proc:ro
        - /sys:/host/sys:ro
        - /:/rootfs:ro

    cadvisor:
      image: gcr.io/cadvisor/cadvisor:v0.49.1
      container_name: cadvisor
      cap_drop: [ALL]
      read_only: true
      security_opt: ["no-new-privileges:true"]
      logging: # bounded so an unattended run cannot fill the SD card
        driver: json-file
        options:
          max-size: 10m
          max-file: "3"
      healthcheck: # functional probe, see contracts/health-probes.md
        test: ["CMD", "/usr/bin/cadvisor", "-h"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 120s
      pids_limit: 200
      volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

networks:
  core:
    # Fixed subnet so bitcoind's -rpcallowip can be pinned to the core network.
    # Only services listed on this network can reach the bitcoind RPC/P2P ports.
    ipam:
      config:
        - subnet: 172.28.0.0/24
  explorer:
    # Explorer plane: web <-> api <-> db. No node RPC here, so a compromised
    # front end cannot reach the node's control interface.
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
    bitcoin_data:
    electrs_data:
    mempool_data:
    mempool_db:
    grafana_data:
    prometheus_data:
