
services:
    bitcoin:
        image: 4324363/bitcoind:32.1
        container_name: bitcoind
        stop_grace_period: 5m # let bitcoind flush its UTXO cache
        volumes:
            - bitcoin_data:/home/bitcoin/.bitcoin
            - ./import.sh:/import.sh
            - ./utxo-snapshot-height-840000.dat:/utxo-snapshot-height-840000.dat
        # the import runs /import.sh as the image user, so no root entrypoint
        # dance and no capabilities are needed here
        cap_drop: [ALL]
        # parity:allow cap_add user read_only healthcheck
        # one-shot: /import.sh exits when the import finishes, so a healthcheck
        # would only ever flap; `docker compose up` returning is the signal
        security_opt: ["no-new-privileges:true"]
        logging: # bounded so an unattended run cannot fill the SD card
          driver: json-file
          options:
            max-size: 10m
            max-file: "3"
        pids_limit: 300
        entrypoint: /import.sh

volumes:
    bitcoin_data:
