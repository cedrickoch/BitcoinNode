
services:
    bitcoin:
        image: bitcoin/bitcoin:32.1
        container_name: bitcoind
        volumes:
            - bitcoin_data:/home/bitcoin/.bitcoin
        environment:
          - UID=1000
          - GID=1000
        networks:
          - core
        cap_drop: [ALL]
        # entrypoint starts as root and drops to the bitcoin user (gosu), and may
        # chown the data dir, so those caps come back even with the rest dropped
        cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
        security_opt: ["no-new-privileges:true"]
        pids_limit: 300
        # no mem_limit: initial block sync and snapshot import have RAM spikes
        command: ["-printtoconsole", "-rpcbind=0.0.0.0", "-rpcallowip=172.28.0.0/24", "-txindex=1"]

    electrs:
      image: 4324363/electrs:v0.12.0-arm64
      container_name: electrs
      user: "1000:1000" # not root; reads the cookie file owned by uid 1000
      cap_drop: [ALL]
      security_opt: ["no-new-privileges:true"]
      pids_limit: 300
      # no mem_limit: initial indexing has big RAM spikes
      command: ["/usr/bin/electrs"] 
      networks:
        - default
        - core
      ports:
        - "50001:50001" # For the electrs API on mainnet
      volumes:
        - electrs_data:/home/bitcoin
        - bitcoin_data:/home/bitcoin/.bitcoin:ro
      ulimits:
        nofile:
          soft: 65536
          hard: 65536
      environment:
          - ELECTRS_DAEMON_DIR=/home/bitcoin/.bitcoin/ # Specify the directory since running in testnet mode we will have a different dir structure
          - ELECTRS_DAEMON_RPC_ADDR=bitcoin:8332 # Need to match the port as well
          - ELECTRS_DAEMON_P2P_ADDR=bitcoin:8333 # Need to match the port as well
          - ELECTRS_DAEMON_RPC_COOKIE=/home/bitcoin/.bitcoin/.cookie # Need to match the cookie file
          - ELECTRS_DB_DIR=/home/bitcoin/db
          - ELECTRS_ELECTRUM_RPC_ADDR=electrs:50001
          - ELECTRS_MONITORING_ADDR=electrs:4224
          - ELECTRS_PARALLELISM=1
      depends_on:
        - bitcoin

    web:
      environment:
        FRONTEND_HTTP_PORT: "8080"
        BACKEND_MAINNET_HTTP_HOST: "api"
      image: mempool/frontend:v3.3.1
      user: "1000:1000"
      cap_drop: [ALL]
      security_opt: ["no-new-privileges:true"]
      pids_limit: 100
      restart: on-failure
      stop_grace_period: 1m
      command: "./wait-for db:3306 --timeout=720 -- nginx -g 'daemon off;'"
      ports:
        - "80:8080"

    api:
      environment:
        MEMPOOL_BACKEND: "electrum"
        ELECTRUM_HOST: electrs
        ELECTRUM_PORT: "50001"
        ELECTRUM_TLS: "false"
        CORE_RPC_HOST: bitcoin
        CORE_RPC_PORT: "8332"
        CORE_RPC_COOKIE: "true"
        CORE_RPC_COOKIE_PATH: "/home/bitcoin/.bitcoin/.cookie"
        DATABASE_ENABLED: "true"
        DATABASE_HOST: "db"
        DATABASE_DATABASE: "mempool"
        DATABASE_USERNAME: "mempool"
        DATABASE_PASSWORD: "mempool"
        STATISTICS_ENABLED: "true"
        MEMPOOL_POLL_RATE_MS: "20000" # Optimized CPU load from 100% to 20%
      image: mempool/backend:v3.3.1
      user: "1000:1000" # not root; reads the cookie file owned by uid 1000
      networks:
        - default
        - core
      cap_drop: [ALL]
      security_opt: ["no-new-privileges:true"]
      pids_limit: 300
      restart: on-failure
      stop_grace_period: 1m
      command: "./wait-for-it.sh db:3306 --timeout=720 --strict -- ./start.sh"
      volumes:
        - mempool_data:/backend/cache
        - bitcoin_data:/home/bitcoin/.bitcoin:ro


    db:
      environment:
        MYSQL_DATABASE: "mempool"
        MYSQL_USER: "mempool"
        MYSQL_PASSWORD: "mempool"
        MYSQL_ROOT_PASSWORD: "admin"
      image: mariadb
      user: "root" # entrypoint needs root: it chowns the data dir and drops to the mysql user
      cap_drop: [ALL]
      cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
      security_opt: ["no-new-privileges:true"]
      pids_limit: 300
      restart: on-failure
      stop_grace_period: 1m
      volumes:
        - mempool_db:/var/lib/mysql

    grafana:
      image: grafana/grafana:latest
      cap_drop: [ALL]
      security_opt: ["no-new-privileges:true"]
      read_only: true
      tmpfs: [/tmp]
      pids_limit: 200
      environment:
        GF_USERS_ALLOW_SIGN_UP: "false"
      restart: always
      ports:
        - 3000:3000
      volumes:
        - grafana_data:/var/lib/grafana

    prometheus:
      image: prom/prometheus:latest
      cap_drop: [ALL]
      security_opt: ["no-new-privileges:true"]
      pids_limit: 200
      restart: always
      volumes:
        - prometheus_data:/prometheus
        - ./prometheus/:/etc/prometheus/
      command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      depends_on:
        - node_exporter

    node_exporter:
      image: prom/node-exporter:latest
      cap_drop: [ALL]
      security_opt: ["no-new-privileges:true"]
      pids_limit: 100
      restart: always
      volumes:
        - /proc:/host/proc:ro
        - /sys:/host/sys:ro
        - /:/rootfs:ro

    json_exporter:
      image: quay.io/prometheuscommunity/json-exporter:latest
      cap_drop: [ALL]
      security_opt: ["no-new-privileges:true"]
      pids_limit: 50
      restart: always
      command:
        - '--config.file=/config.yml'
      volumes:
        - ./bitaxe/json_exporter/config.yml:/config.yml

    bitcoind_exporter:
      image: ghcr.io/primexz/bitcoind-exporter:latest
      networks:
        - default
        - core
      user: "1000:1000" # to read the bitcoind cookie file (owned by uid 1000)
      cap_drop: [ALL]
      security_opt: ["no-new-privileges:true"]
      pids_limit: 100
      restart: always
      environment:
        RPC_ADDRESS: "http://bitcoin:8332"
        # Cookie auth — same rotating cookie the other services use, so we don't
        # have to set rpcuser/rpcpassword on bitcoind (which would disable it).
        RPC_COOKIE_FILE: "/home/bitcoin/.bitcoin/.cookie"
        METRIC_PORT: "9332"
      volumes:
        - bitcoin_data:/home/bitcoin/.bitcoin:ro
      depends_on:
        - bitcoin

    cadvisor:
      image: gcr.io/cadvisor/cadvisor:latest
      container_name: cadvisor
      cap_drop: [ALL]
      security_opt: ["no-new-privileges:true"]
      pids_limit: 200
      volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

    public-pool:
      image: 4324363/public-pool:arm64
      networks:
        - core
      cap_drop: [ALL]
      security_opt: ["no-new-privileges:true"]
      pids_limit: 200
      restart: always
      volumes:
        - bitcoin_data:/home/bitcoin/.bitcoin:ro
        - ./public-pool/.env:/public-pool/.env
      ports:
        - 3333:3333
        - 3334:3334

    btctrack:
      image: 4324363/btctrack:v1.4-arm64
      container_name: btctrack
      cap_drop: [ALL]
      security_opt: ["no-new-privileges:true"]
      pids_limit: 200
      restart: unless-stopped
      ports:
        - "8501:8501"
      # Runtime config — every value has a default, override by setting the var
      # in your shell before `docker compose up`. BTCTRACK_DB_PATH is baked into
      # the image (Dockerfile) and tied to the ./data volume mount below.
      environment:
        ELECTRUM_HOST: ${ELECTRUM_HOST:-electrs}
        ELECTRUM_PORT: ${ELECTRUM_PORT:-50001}
        ELECTRUM_USE_SSL: ${ELECTRUM_USE_SSL:-false}
        BASE_CURRENCY: ${BASE_CURRENCY:-CHF}
        GAP_LIMIT: ${GAP_LIMIT:-20}
      volumes:
        - btctrack_data:/app/data

networks:
  core:
    # Fixed subnet so bitcoind's -rpcallowip can be pinned to the core network.
    # Only services listed on this network can reach the bitcoind RPC/P2P ports.
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
    bitcoin_data:
    electrs_data:
    mempool_data:
    mempool_db:
    grafana_data:
    prometheus_data:
    btctrack_data:
